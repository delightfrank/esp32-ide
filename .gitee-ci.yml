# Gitee CI/CD 配置
# 文档: https://gitee.com/help/articles/4300

stages:
  - build

# Windows 构建
build-windows:
  stage: build
  image: node:20
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - cd app
    - npm ci
    - npx vite build
    - npx electron-builder --win --x64
  artifacts:
    paths:
      - app/release/*.exe
    expire_in: 30 days

# macOS 构建
build-macos:
  stage: build
  image: node:20
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - cd app
    - npm ci
    - npx vite build
    - npx electron-builder --mac
  artifacts:
    paths:
      - app/release/*.dmg
      - app/release/*.zip
    expire_in: 30 days

# Linux 构建
build-linux:
  stage: build
  image: node:20
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - cd app
    - npm ci
    - npx vite build
    - npx electron-builder --linux --x64
  artifacts:
    paths:
      - app/release/*.AppImage
      - app/release/*.deb
      - app/release/*.tar.gz
    expire_in: 30 days
