name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build frontend
        working-directory: app
        run: npx vite build
      - name: Build Electron (Windows)
        working-directory: app
        run: npx electron-builder --win --x64 --config electron-builder.yml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: app/release/*.exe
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build frontend
        working-directory: app
        run: npx vite build
      - name: Build Electron (macOS)
        working-directory: app
        run: npx electron-builder --mac --config electron-builder.yml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: app/release/*
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3-dev libxss-dev libxtst-dev libatspi2.0-dev libdrm-dev libgbm-dev xvfb
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build frontend
        working-directory: app
        run: npx vite build
      - name: Build Electron (Linux x64)
        working-directory: app
        run: xvfb-run npx electron-builder --linux --x64 --config electron-builder.yml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: app/release/*
          if-no-files-found: warn

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: find artifacts -type f | head -30
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
