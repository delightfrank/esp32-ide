appId: com.esp32.ide
productName: ESP32 IDE
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - src/main/**/*
  - node_modules/**
  - package.json

extraResources:
  - from: tools/
    to: tools/

asar: true

# 跳过 electron-builder 自带的 npm rebuild
# 改在 CI workflow 中手动执行 @electron/rebuild
npmRebuild: false

linux:
  target:
    - target: AppImage
      arch:
        - x64

mac:
  target:
    - target: dmg
      arch:
        - universal

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ESP32 IDE
  installerLanguages:
    - 2052
    - 1033
  language: 2052
